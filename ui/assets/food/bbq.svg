  </defs>
  <rect width="600" height="400" rx="16" fill="url(#grad_bbq)" />
  <circle cx="300" cy="170" r="95" fill="rgba(255, 255, 255, 0.15)" />
  <circle cx="300" cy="170" r="75" fill="rgba(255, 255, 255, 0.22)" filter="url(#shadow)" />
  <text x="300" y="200" font-size="76" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🍢</text>
  <rect x="180" y="275" width="240" height="32" rx="16" fill="rgba(0, 0, 0, 0.25)" />
  <text x="300" y="296" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" letter-spacing="1">Charcoal Smoked</text>
  <text x="300" y="345" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">BBQ & Tikka Grills</text>
